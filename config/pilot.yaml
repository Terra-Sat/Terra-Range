study:
  name: "Terra-Range pilot"
  area: "Chalbi basin and surrounding grazing corridors"
  crs: "EPSG:32637"
  grid_size_km: 5
  baseline_years: [2001, 2020]
  analysis_window:
    start: "2024-01-01"
    end: "2026-12-31"
  aoi:
    source: "pilot_boundary.geojson"
    layer: "pilot_aoi"
  outputs:
    processed_dir: "data/processed"
    manifest_filename: "manifest.json"

methodology:
  version: "2026.10"
  notes:
    - "VCI and rainfall anomaly indicators are computed on a 5 km grid."
    - "Water indicators are species-specific and seasonal."
