name: Terra-Range CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall pipeline backend
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest
