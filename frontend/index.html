<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Range · Administrative boundaries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{--ink:#18292b;--muted:#5c6b6a;--paper:#f4f6f3;--panel:#fff;--line:#d5dcd6;--bad:#b3412e;--ok:#2d6a4f;
--counties:#1f6b73;--constituencies:#b9812a;--wards:#4a5fa8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.45 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--ink);background:var(--paper);display:grid;grid-template-columns:350px 1fr}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
header{padding:16px 18px 12px}
h1{font-size:19px;margin:0 0 2px}
header p{margin:0;color:var(--muted);font-size:13px}
section{padding:12px 18px;border-top:1px solid var(--line)}
h2{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 4px;font:inherit;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{color:#fff;background:var(--lc)}
.seg small{display:block;font-size:11px;opacity:.8}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f2b705;outline-offset:1px}
select,input[type=search]{width:100%;font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:8px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:2px}
#list{max-height:210px;overflow:auto;margin:0;padding:0;list-style:none}
#list button{width:100%;text-align:left;border:0;background:none;padding:6px 8px;font:inherit;border-left:4px solid transparent;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#list button:hover{background:var(--paper)}
#list button[aria-current=true]{border-left-color:var(--lc);background:var(--paper);font-weight:700}
#list span+span{color:var(--muted);font-size:13px;white-space:nowrap}
.chartbox{height:170px}
#checks{margin:0;padding:0;list-style:none;font-size:13px}
#checks li::before{content:"OK  ";color:var(--ok);font-weight:700}
#checks li.bad::before{content:"CHECK  ";color:var(--bad)}
main{position:relative;min-height:0}
#map{position:absolute;inset:0}
#crumbs{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#crumbs button{pointer-events:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
#card{position:absolute;right:12px;bottom:28px;width:290px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 6px 24px rgba(24,41,43,.15)}
#card[hidden]{display:none}
#card h3{margin:0;font-size:17px}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 10px;font-size:14px}
#card dt{color:var(--muted)}#card dd{margin:0}
#card .row{display:flex;gap:8px}
#card button{font:inherit;font-size:14px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
#card button.primary{background:var(--lc);color:#fff;border-color:var(--lc)}
#err{margin:12px 18px;padding:10px;border:1px solid var(--bad);border-radius:6px;color:var(--bad);font-size:13px}
#err[hidden]{display:none}
.basemap{display:flex;gap:6px;align-items:center;font-size:13px}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}main{order:-1;height:55vh}aside{border-right:0}#card{width:auto;left:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside>
  <header>
    <h1>Marsabit boundaries</h1>
    <p>Switch between county, constituency and ward layers.</p>
  </header>
  <section>
    <h2>Boundary level</h2>
    <div class="seg" id="seg" role="group" aria-label="Boundary level"></div>
  </section>
  <section>
    <h2>Focus</h2>
    <label for="fConst">Constituency</label><select id="fConst"></select>
    <label for="fWard">Ward</label><select id="fWard"></select>
    <label class="basemap"><input type="checkbox" id="bm" checked> Show basemap</label>
  </section>
  <section>
    <h2 id="listTitle">Units</h2>
    <input type="search" id="q" placeholder="Search by name" aria-label="Search by name">
    <ul id="list"></ul>
  </section>
  <section>
    <h2 id="chartTitle">Area (km²)</h2>
    <div class="chartbox"><canvas id="chart" aria-label="Area by unit"></canvas></div>
  </section>
  <section>
    <h2>Data checks</h2>
    <ul id="checks"></ul>
  </section>
  <div id="err" role="alert" hidden></div>
</aside>
<main>
  <div id="map"></div>
  <nav id="crumbs" aria-label="Breadcrumb"></nav>
  <div id="card" hidden></div>
</main>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script>
/* ---------- Configuration ---------- */
const CFG = {
  source: 'api',                       // 'static' = data/*.geojson, 'api' = Django endpoints
  api: '/api/v1/boundaries/',
  staticDir: 'data/',
  expected: {counties: 1, constituencies: 4, wards: 20},
  // Property names per level. The API returns code/name/parent_code; for static GeoJSON
  // edit these to match your GeoPackage columns (first match wins).
  fields: {
    counties:       {code: ['code'], name: ['name'], parent: []},
    constituencies: {code: ['code'], name: ['name'], parent: ['parent_code']},
    wards:          {code: ['code'], name: ['name'], parent: ['parent_code']}
  }
};
const LV = [
  {id: 'counties', label: 'County', plural: 'counties', color: '#1f6b73'},
  {id: 'constituencies', label: 'Constituency', plural: 'constituencies', color: '#b9812a'},
  {id: 'wards', label: 'Ward', plural: 'wards', color: '#4a5fa8'}
];
const S = {level: 'counties', feats: {}, sel: null, hover: null, constFocus: ''};
const $ = id => document.getElementById(id);
const idx = id => LV.findIndex(l => l.id === id);

/* ---------- Data ---------- */
const pick = (p, keys) => { for (const k of keys) if (p[k] != null && p[k] !== '') return String(p[k]); return ''; };
function ringKm2(r) {
  const lat0 = r.reduce((s, c) => s + c[1], 0) / r.length * Math.PI / 180, kx = 111.32 * Math.cos(lat0), ky = 110.57;
  let a = 0;
  for (let i = 0; i < r.length - 1; i++) a += r[i][0] * kx * r[i + 1][1] * ky - r[i + 1][0] * kx * r[i][1] * ky;
  return Math.abs(a) / 2;
}
function approxArea(g) {
  const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates;
  return polys.reduce((s, p) => s + ringKm2(p[0]) - p.slice(1).reduce((t, h) => t + ringKm2(h), 0), 0);
}
function bbox(g) {
  let b = [1e9, 1e9, -1e9, -1e9];
  (function w(c) { if (typeof c[0] === 'number') b = [Math.min(b[0], c[0]), Math.min(b[1], c[1]), Math.max(b[2], c[0]), Math.max(b[3], c[1])]; else c.forEach(w); })(g.coordinates);
  return b;
}
async function load(level) {
  const url = CFG.source === 'api' ? `${CFG.api}${level}/` : `${CFG.staticDir}${level}.geojson`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`${url} returned ${r.status}`);
  const gj = await r.json(), F = CFG.fields[level];
  gj.features.forEach((f, i) => {
    f.id = i;
    const p = f.properties || {};
    const code = pick(p, F.code);
    f.n = {code, name: pick(p, F.name) || code || `Unit ${i + 1}`, parent: pick(p, F.parent),
           area: p.area_km2 != null ? +p.area_km2 : approxArea(f.geometry), approx: p.area_km2 == null,
           bbox: bbox(f.geometry)};
  });
  S.feats[level] = gj.features;
  return gj;
}
const find = (level, code) => S.feats[level].find(f => f.n.code === code);
const parentOf = (level, f) => idx(level) > 0 ? find(LV[idx(level) - 1].id, f.n.parent) : null;

/* Scope: which features of a level are inside the current constituency focus */
function inScope(level, f) {
  const c = S.constFocus;
  if (!c) return true;
  if (level === 'wards') return f.n.parent === c;
  if (level === 'constituencies') return f.n.code === c;
  return true;
}
const visible = level => S.feats[level].filter(f => inScope(level, f));

/* ---------- Map ---------- */
let map;
function initMap(data) {
  map = new maplibregl.Map({
    container: 'map', center: [38, 2.9], zoom: 6, attributionControl: {compact: true},
    style: {version: 8,
      sources: {osm: {type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap contributors'}},
      layers: [{id: 'bg', type: 'background', paint: {'background-color': '#e9eee9'}},
               {id: 'osm', type: 'raster', source: 'osm', paint: {'raster-opacity': 0.5, 'raster-saturation': -0.7}}]}
  });
  map.addControl(new maplibregl.NavigationControl({showCompass: false}), 'bottom-left');
  map.on('load', () => {
    LV.forEach(l => {
      map.addSource(l.id, {type: 'geojson', data: data[l.id]});
      map.addLayer({id: l.id + '-fill', type: 'fill', source: l.id,
        paint: {'fill-color': l.color, 'fill-opacity': 0, 'fill-opacity-transition': {duration: 350}}});
      map.addLayer({id: l.id + '-line', type: 'line', source: l.id,
        paint: {'line-color': l.color, 'line-opacity': 0, 'line-width': 1.4,
                'line-opacity-transition': {duration: 350}, 'line-width-transition': {duration: 350}}});
    });
    const popup = new maplibregl.Popup({closeButton: false, closeOnClick: false, offset: 8});
    map.on('mousemove', e => {
      const lid = S.level, hit = map.queryRenderedFeatures(e.point, {layers: [lid + '-fill']})[0];
      setHover(hit ? hit.id : null);
      map.getCanvas().style.cursor = hit ? 'pointer' : '';
      if (hit) popup.setLngLat(e.lngLat).setText(S.feats[lid][hit.id].n.name).addTo(map); else popup.remove();
    });
    map.on('click', e => {
      const hit = map.queryRenderedFeatures(e.point, {layers: [S.level + '-fill']})[0];
      if (hit) select(S.level, hit.id);
    });
    restyle(); applyScope(); fitAll();
  });
}
function setHover(id) {
  if (S.hover === id) return;
  if (S.hover != null) map.setFeatureState({source: S.level, id: S.hover}, {hover: false});
  S.hover = id;
  if (id != null) map.setFeatureState({source: S.level, id}, {hover: true});
}
function restyle() {
  const st = ['boolean', ['feature-state', 'sel'], false];
  LV.forEach(l => {
    const role = l.id === S.level ? 'active' : idx(l.id) === idx(S.level) - 1 ? 'context' : 'off';
    map.setPaintProperty(l.id + '-fill', 'fill-opacity', role !== 'active' ? 0 :
      ['case', st, 0.6, ['boolean', ['feature-state', 'hover'], false], 0.5, ['boolean', ['feature-state', 'dim'], false], 0.05, 0.3]);
    map.setPaintProperty(l.id + '-line', 'line-opacity', role === 'active' ? 0.95 : role === 'context' ? 0.85 : 0);
    map.setPaintProperty(l.id + '-line', 'line-width', role === 'active' ? ['case', st, 3.5, 1.4] : role === 'context' ? 3 : 0.5);
  });
}
function applyScope() {
  LV.forEach(l => S.feats[l.id].forEach(f => map.setFeatureState({source: l.id, id: f.id}, {dim: !inScope(l.id, f)})));
}
function fitBox(b) { map.fitBounds([[b[0], b[1]], [b[2], b[3]]], {padding: {top: 60, bottom: 40, left: 40, right: 340}, duration: 700, maxZoom: 11}); }
function fitAll() {
  const fs = visible(S.level).length ? visible(S.level) : S.feats[S.level];
  fitBox(fs.reduce((b, f) => [Math.min(b[0], f.n.bbox[0]), Math.min(b[1], f.n.bbox[1]), Math.max(b[2], f.n.bbox[2]), Math.max(b[3], f.n.bbox[3])], [1e9, 1e9, -1e9, -1e9]));
}

/* ---------- Actions ---------- */
function setLevel(id, keepSel) {
  S.level = id;
  if (!keepSel) clearSel();
  restyle(); render(); fitAll();
  history.replaceState(null, '', `#${id}${S.constFocus ? ',' + S.constFocus : ''}`);
}
function clearSel() {
  if (S.sel) map.setFeatureState({source: S.sel.level, id: S.sel.id}, {sel: false});
  S.sel = null; $('card').hidden = true;
}
function select(level, id) {
  clearSel();
  S.sel = {level, id};
  map.setFeatureState({source: level, id}, {sel: true});
  fitBox(S.feats[level][id].n.bbox);
  renderCard(); renderList();
}
function setConstFocus(code) {
  S.constFocus = code; clearSel(); applyScope(); render();
  if (code) { const f = find('constituencies', code); if (f) fitBox(f.n.bbox); } else fitAll();
  history.replaceState(null, '', `#${S.level}${code ? ',' + code : ''}`);
}

/* ---------- UI ---------- */
function render() {
  const lv = LV[idx(S.level)];
  document.documentElement.style.setProperty('--lc', lv.color);
  $('seg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === S.level));
  const cs = [['', 'All constituencies'], ...S.feats.constituencies.map(f => [f.n.code, f.n.name])];
  $('fConst').innerHTML = cs.map(([v, t]) => `<option value="${v}">${t.replace(/</g, '&lt;')}</option>`).join('');
  $('fConst').value = S.constFocus;
  const ws = S.feats.wards.filter(f => !S.constFocus || f.n.parent === S.constFocus);
  $('fWard').innerHTML = `<option value="">All wards</option>` + ws.map(f => `<option value="${f.id}">${f.n.name.replace(/</g, '&lt;')}</option>`).join('');
  $('listTitle').textContent = `${lv.label} units (${visible(S.level).length})`;
  renderList(); renderChart(); renderCrumbs(); if (S.sel) renderCard();
}
function renderList() {
  const q = $('q').value.trim().toLowerCase(), ul = $('list');
  ul.innerHTML = '';
  visible(S.level).filter(f => f.n.name.toLowerCase().includes(q)).sort((a, b) => a.n.name.localeCompare(b.n.name)).forEach(f => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.innerHTML = '<span></span><span></span>';
    b.children[0].textContent = f.n.name;
    b.children[1].textContent = `${Math.round(f.n.area).toLocaleString()} km²`;
    if (S.sel && S.sel.level === S.level && S.sel.id === f.id) b.setAttribute('aria-current', 'true');
    b.onclick = () => select(S.level, f.id);
    li.appendChild(b); ul.appendChild(li);
  });
}
function renderCard() {
  const {level, id} = S.sel, f = S.feats[level][id], i = idx(level), lv = LV[i], p = parentOf(level, f);
  const kids = i < 2 ? S.feats[LV[i + 1].id].filter(k => k.n.parent === f.n.code) : [];
  const c = $('card'); c.hidden = false;
  c.innerHTML = `<h3></h3><dl><dt>Level</dt><dd>${lv.label}</dd><dt>Code</dt><dd></dd>${p ? '<dt>Within</dt><dd></dd>' : ''}<dt>Area</dt><dd>${Math.round(f.n.area).toLocaleString()} km²${f.n.approx ? ' (approx.)' : ''}</dd>${i < 2 ? `<dt>Contains</dt><dd>${kids.length} ${LV[i + 1].plural}</dd>` : ''}</dl><div class="row"></div>`;
  c.querySelector('h3').textContent = f.n.name;
  const dds = c.querySelectorAll('dd'); dds[1].textContent = f.n.code || 'n/a'; if (p) dds[2].textContent = p.n.name;
  const row = c.querySelector('.row');
  if (kids.length) {
    const b = document.createElement('button'); b.className = 'primary'; b.textContent = `Show ${LV[i + 1].plural}`;
    b.onclick = () => { if (level === 'constituencies') S.constFocus = f.n.code; applyScope(); setLevel(LV[i + 1].id); render(); };
    row.appendChild(b);
  }
  const x = document.createElement('button'); x.textContent = 'Clear'; x.onclick = () => { clearSel(); renderList(); }; row.appendChild(x);
}
function renderCrumbs() {
  const nav = $('crumbs'); nav.innerHTML = '';
  const add = (t, fn) => { const b = document.createElement('button'); b.textContent = t; b.onclick = fn; nav.appendChild(b); };
  const county = S.feats.counties[0];
  add(county ? county.n.name : 'County', () => { S.constFocus = ''; applyScope(); setLevel('counties'); render(); });
  if (S.constFocus) add(find('constituencies', S.constFocus).n.name, () => setLevel('constituencies', false));
}
let chart;
function renderChart() {
  const lv = LV[idx(S.level)], fs = visible(S.level).slice().sort((a, b) => b.n.area - a.n.area);
  $('chartTitle').textContent = `Area by ${lv.label.toLowerCase()} (km²)`;
  const data = {labels: fs.map(f => f.n.name), datasets: [{data: fs.map(f => Math.round(f.n.area)), backgroundColor: lv.color}]};
  if (!chart) chart = new Chart($('chart'), {type: 'bar', data, options: {indexAxis: 'y', maintainAspectRatio: false, plugins: {legend: {display: false}}, animation: {duration: 300}, scales: {y: {ticks: {font: {size: 10}}}}}});
  else { chart.data = data; chart.update(); }
}
function runChecks() {
  const out = [];
  LV.forEach(l => out.push([S.feats[l.id].length === CFG.expected[l.id], `${l.label} records: ${S.feats[l.id].length} (expected ${CFG.expected[l.id]})`]));
  const codes = new Set(S.feats.counties.map(f => f.n.code)), kc = new Set(S.feats.constituencies.map(f => f.n.code));
  const oc = S.feats.constituencies.filter(f => !codes.has(f.n.parent)).length, ow = S.feats.wards.filter(f => !kc.has(f.n.parent)).length;
  out.push([oc === 0, `Constituencies linked to a county: ${S.feats.constituencies.length - oc} of ${S.feats.constituencies.length}`]);
  out.push([ow === 0, `Wards linked to a constituency: ${S.feats.wards.length - ow} of ${S.feats.wards.length}`]);
  const dup = LV.some(l => new Set(S.feats[l.id].map(f => f.n.code)).size !== S.feats[l.id].length);
  out.push([!dup, dup ? 'Duplicate or missing codes found' : 'Codes are unique']);
  $('checks').innerHTML = out.map(([ok, t]) => `<li class="${ok ? '' : 'bad'}">${t}</li>`).join('');
}

/* ---------- Boot ---------- */
async function boot() {
  $('seg').innerHTML = LV.map(l => `<button data-id="${l.id}" style="--lc:${l.color}" aria-pressed="false">${l.label}<small></small></button>`).join('');
  try {
    const data = {};
    for (const l of LV) data[l.id] = await load(l.id);
    LV.forEach(l => $('seg').querySelector(`[data-id=${l.id}] small`).textContent = S.feats[l.id].length);
    const h = location.hash.slice(1).split(',');
    if (LV.some(l => l.id === h[0])) S.level = h[0];
    if (h[1] && find('constituencies', h[1])) S.constFocus = h[1];
    initMap(data); runChecks(); render();
  } catch (e) {
    const el = $('err'); el.hidden = false;
    el.textContent = `Could not load boundaries: ${e.message}. Check CFG.source and that the GeoJSON files or API endpoints exist.`;
  }
  $('seg').onclick = e => { const b = e.target.closest('button'); if (b) setLevel(b.dataset.id); };
  $('fConst').onchange = e => setConstFocus(e.target.value);
  $('fWard').onchange = e => { if (e.target.value === '') return; S.level = 'wards'; restyle(); render(); select('wards', +e.target.value); $('fWard').value = e.target.value; };
  $('q').oninput = renderList;
  $('bm').onchange = e => map.setPaintProperty('osm', 'raster-opacity', e.target.checked ? 0.5 : 0);
}
boot();
</script>
</body>
</html>
